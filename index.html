<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>🔥 Moto Nzuri Field Ops </title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0b0a09;--surface:#1a1613;--surface-light:#241e1a;
      --text:#f5e6d3;--text-dim:#b8a38b;--accent:#ff8c00;
      --flame:#ffb347;--success:#2ecc71;--danger:#e74c3c;
      --border:#3a2e24;--radius:10px;--btn-bg:#241e1a;--btn-text:#f5e6d3
    }
    body.light-mode{
      --bg:#f8f4f0;--surface:#fff;--surface-light:#f0ebe4;
      --text:#1a1613;--text-dim:#5c4e3d;--accent:#d97706;
      --flame:#92400e;--success:#10b981;--danger:#dc2626;
      --border:#d6ccc0;--btn-bg:#e7ddd0;--btn-text:#1a1613
    }
    body{
      font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background-image:radial-gradient(circle at 20% 10%,rgba(255,69,0,0.12) 0%,transparent 50%);
      transition:background 0.3s,color 0.3s
    }
    #app-container{width:100%;max-width:1300px;margin:10px auto;padding:15px}
    .logo{display:flex;align-items:center;gap:10px;font-size:1.8rem;font-weight:700}
    .logo span{background:linear-gradient(135deg,#ff8c00,#ff4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    h1,h2,h3{font-weight:600;color:var(--flame);text-shadow:0 0 8px rgba(255,140,0,0.4)}
    button,.btn{background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);padding:10px 18px;border-radius:25px;font-weight:600;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;font-size:0.9rem}
    button:hover{border-color:var(--accent);box-shadow:0 0 15px rgba(255,140,0,0.5);background:#2a211c;color:#fff}
    button.accent{background:linear-gradient(145deg,#ff8c00,#e67600);border:none;color:#0c0b0a;font-weight:700;box-shadow:0 4px 15px rgba(255,69,0,0.6)}
    button.danger{border-color:var(--danger);color:var(--danger);background:rgba(231,76,60,0.1)}
    input,select,textarea{background:var(--surface);border:1px solid var(--border);padding:12px 15px;border-radius:25px;color:var(--text);font-size:0.95rem;width:100%;outline:none}
    input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(255,140,0,0.4)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 8px 20px rgba(0,0,0,0.5)}
    .table-wrapper{overflow-x:auto;border-radius:15px;border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse;background:var(--surface-light)}
    th{background:#2a1f18;padding:12px 10px;text-align:left;font-weight:700;color:var(--flame);border-bottom:2px solid var(--accent)}
    td{padding:10px;border-bottom:1px solid var(--border)}
    tr:hover td{background:rgba(255,140,0,0.05)}
    .badge{display:inline-block;padding:4px 12px;border-radius:15px;font-size:0.75rem;font-weight:700}
    .badge-success{background:rgba(46,204,113,0.2);color:#2ecc71;border:1px solid #2ecc71}
    .badge-warning{background:rgba(255,140,0,0.2);color:#ff8c00;border:1px solid #ff8c00}
    .map-link{color:var(--accent);text-decoration:underline;cursor:pointer}
    .flex-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000}
    .modal-content{background:var(--surface);border:1px solid var(--accent);border-radius:25px;padding:25px;max-width:700px;width:90%;max-height:85vh;overflow-y:auto}
    .toast{position:fixed;bottom:20px;right:20px;background:#2c1e14;border-left:4px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:30px;z-index:2000;animation:slideIn 0.3s}
    @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
    .nav-tabs{display:flex;gap:5px;border-bottom:1px solid var(--border);margin-bottom:20px}
    .nav-tab{padding:10px 20px;border-radius:15px 15px 0 0;background:transparent;border:none;color:var(--text-dim);font-weight:600;cursor:pointer}
    .nav-tab.active{background:var(--surface-light);color:var(--accent);border-bottom:2px solid var(--accent)}
    .fab{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#ff8c00,#e67600);border:none;color:#0b0a09;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(255,69,0,0.7);cursor:pointer;z-index:500}
    .strength-bar{height:6px;border-radius:3px;margin-top:4px;background:var(--border);width:100%}
    .strength-bar div{height:100%;border-radius:3px;transition:width 0.3s}
    @media print{body{background:white;color:black}.no-print,.nav-tabs,button,.modal,.toast,.fab{display:none!important}.card{box-shadow:none;border:1px solid #ccc}}
  </style>
</head>
<body>

  const simpleHash = s => { let h=0; for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return 'h_'+Math.abs(h).toString(16); };
  const resetTimer = () => { clearTimeout(sessionTimer); sessionTimer = setTimeout(autoLogout, TIMEOUT); };

    {id:"34",name:"Kero and Blue Gas",coords:"-1.26115,36.86294",status:"Anthony Mwangi 0726654592 KP2193",branding:"",mn:"",iot:"",contact:"Anthony Mwangi",phone:"0726654592"},
    {id:"35",name:"Davie's Electrical",coords:"-1.2552832,36.8624338",status:"Moses Aluoch 0799058294",branding:"",mn:"",iot:"",contact:"Moses Aluoch",phone:"0799058294"},
    {id:"36",name:"Henice Kerosene and Gas",coords:"-1.289376,36.84455605",status:"Henry Gakuyi 0724407896 KP0262",branding:"",mn:"",iot:"",contact:"Henry Gakuyi",phone:"0724407896"},
    {id:"37",name:"Kimuka gas",coords:"-1.359592,36.598003",status:"KP-1459 Elphinah +254759108560",branding:"",mn:"",iot:"",contact:"Elphinah",phone:"+254759108560"},
    {id:"38",name:"Maristella Enterprise",coords:"-1.33568,36.67214",status:"KP-3587 Stella +254722305666",branding:"",mn:"",iot:"",contact:"Stella",phone:"+254722305666"}

  const root = document.getElementById('dynamic-root');
  const showToast = (msg, err=false) => {
    const old = document.querySelector('.toast'); if(old) old.remove();
    const t = document.createElement('div'); t.className='toast'; t.style.borderLeftColor = err ? 'var(--danger)' : 'var(--accent)';
    t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
  };
  const escHtml = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };
  const escAttr = s => (s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  const migrateData = () => {
    if(localStorage.getItem(KEYS.VERSION)!==APP_VERSION) {
      const users=getUsers(); const admin=users.find(u=>u.username==='moto_admin');
      if(admin && admin.password!==simpleHash('crud2026.jay')) { admin.password=simpleHash('crud2026.jay'); saveUsers(users); }
      localStorage.setItem(KEYS.VERSION, APP_VERSION);
    }
  };
  const initData = () => {
    if(!localStorage.getItem(KEYS.USERS)) saveUsers([
      { username:'moto_admin', password:simpleHash('crud2026.jay'), role:'admin', passwordChanged:true, totpSecret:'' },
      { username:'fieldagent1', password:simpleHash(DEFAULT_PASS), role:'field', passwordChanged:false, totpSecret:'' }
    ]);
    if(!localStorage.getItem(KEYS.MERCHANTS)) saveMerchants(defaultMerchants);
    if(!localStorage.getItem(KEYS.LOGS)) saveLogs([]);
    if(!localStorage.getItem(KEYS.SELFIES)) localStorage.setItem(KEYS.SELFIES, JSON.stringify([]));
    migrateData(); applyTheme();
  };

  const applyTheme = () => {
    if(localStorage.getItem(KEYS.THEME)==='light') document.body.classList.add('light-mode');
    else document.body.classList.remove('light-mode');
  };
  window.toggleTheme = () => {
    document.body.classList.toggle('light-mode');
    localStorage.setItem(KEYS.THEME, document.body.classList.contains('light-mode')?'light':'dark');
  };

  const captureDeviceInfo = () => ({ userAgent:navigator.userAgent, platform:navigator.platform, language:navigator.language, screen:`${screen.width}x${screen.height}`, timezone:Intl.DateTimeFormat().resolvedOptions().timeZone });
  const getPublicIP = async () => { try { const r=await fetch('https://api.ipify.org?format=json',{signal:AbortSignal.timeout(3000)}); return (await r.json()).ip; } catch(e){ return 'unavailable'; } };
  const captureSelfie = () => new Promise(resolve => {
    if(!navigator.mediaDevices?.getUserMedia) { resolve(null); return; }
    const video=document.createElement('video'); video.setAttribute('playsinline',''); video.style.display='none'; document.body.appendChild(video);
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(stream => {
      video.srcObject=stream; video.play();
      video.addEventListener('loadeddata', () => {
        const canvas=document.createElement('canvas'); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        canvas.getContext('2d').drawImage(video,0,0);
        const dataUrl=canvas.toDataURL('image/jpeg',0.8); stream.getTracks().forEach(t=>t.stop()); video.remove(); resolve(dataUrl);
      }, {once:true});
    }).catch(() => resolve(null));
  });
  const handleFailedLogin = async (username) => {
    wrongAttempts++; if(wrongAttempts>=3 && !selfieCaptured) {
      selfieCaptured=true; const [ip,selfie]=await Promise.all([getPublicIP(), captureSelfie()]);
      const device=captureDeviceInfo(); const selfies=getSelfies();
      selfies.push({ timestamp: new Date().toISOString(), username, selfie: selfie||'no camera', device, ip });
      localStorage.setItem(KEYS.SELFIES, JSON.stringify(selfies));
      const logs=getLogs(); logs.push({ timestamp: new Date().toISOString(), user: username||'unknown', role:'failed', action:'login_failed_3x', details:`IP: ${ip}, Device: ${JSON.stringify(device)}` }); saveLogs(logs);
    }
  };

  // TOTP (unchanged)
  const dec2hex = s => (s<15.5?'0':'')+Math.round(s).toString(16);
  const hex2dec = s => parseInt(s,16);
  const base32tohex = b32 => { const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; let bits='',hex=''; for(let i=0;i<b32.length;i++){ bits+=chars.indexOf(b32.charAt(i).toUpperCase()).toString(2).padStart(5,'0'); } for(let i=0;i+4<=bits.length;i+=4) hex+=parseInt(bits.substr(i,4),2).toString(16); return hex; };
  const hmacSha1 = async (key,msg) => { if(crypto?.subtle){ const k=new TextEncoder().encode(key); const m=new TextEncoder().encode(msg); const ck=await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-1'},false,['sign']); const sig=await crypto.subtle.sign('HMAC',ck,m); return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join(''); } return null; };
  const generateTOTP = async (secret,time=Math.floor(Date.now()/30000)) => { const key=base32tohex(secret); const msg=dec2hex(time).padStart(16,'0'); const h=await hmacSha1(key,msg); if(!h)return null; const o=hex2dec(h.substring(h.length-1)); return ((hex2dec(h.substr(o*2,8))&0x7fffffff)%1000000).toString().padStart(6,'0'); };

  // Login / Change Password (unchanged)
  const renderLogin = () => {
    wrongAttempts=0; selfieCaptured=false;
    root.innerHTML = `<div class="card" style="max-width:400px;margin:60px auto;text-align:center;">
      <div class="logo" style="justify-content:center;font-size:2.2rem;"><span>🔥 Moto Nzuri</span></div>
      <p style="color:var(--text-dim);">Field Operations</p>
      <input id="login-username" placeholder="Phone/Username"><input id="login-password" type="password" placeholder="Password" style="margin-top:12px;">
      <button id="login-btn" class="accent" style="width:100%;margin-top:20px;">🔐 Sign In</button>
      <p style="font-size:0.75rem;margin-top:15px;">Default: motosana00</p></div>`;
    document.getElementById('login-btn').onclick = handleLogin;
  };
  const handleLogin = async () => {
    const user=document.getElementById('login-username').value.trim(), pass=document.getElementById('login-password').value.trim();
    if(!user||!pass) return showToast('Enter credentials',true);
    const users=getUsers(); const u=users.find(u=>u.username===user);
    if(!u) { await handleFailedLogin(user); return showToast('User not found',true); }
    if(u.password!==simpleHash(pass)) { await handleFailedLogin(user); return showToast('Wrong password',true); }
    wrongAttempts=0; selfieCaptured=false;
    if(u.totpSecret?.length) { renderTwoFactorPrompt(u); }
    else { setSession(u); logActivity('login'); if(!u.passwordChanged) renderChangePassword(u); else renderMainApp(); }
  };
  const renderTwoFactorPrompt = (user) => {
    root.innerHTML = `<div class="card" style="max-width:400px;margin:60px auto;text-align:center;">
      <h3>🔐 Two‑Factor Authentication</h3><p>Enter code from authenticator app.</p>
      <input id="totp-code" type="text" placeholder="6‑digit code" maxlength="6">
      <button id="totp-verify" class="accent" style="width:100%;margin-top:15px;">Verify</button>
      <button id="totp-cancel" style="margin-top:10px;">Cancel</button></div>`;
    document.getElementById('totp-verify').onclick = async () => {
      const code=document.getElementById('totp-code').value.trim();
      const expected = await generateTOTP(user.totpSecret);
      if(expected && code===expected) { setSession(user); logActivity('login_2fa'); if(!user.passwordChanged) renderChangePassword(user); else renderMainApp(); }
      else showToast('Invalid 2FA code',true);
    };
    document.getElementById('totp-cancel').onclick = renderLogin;
  };
  const renderChangePassword = (user) => {
    root.innerHTML = `<div class="card" style="max-width:400px;margin:60px auto;">
      <h3>🔥 Change Password</h3><p>Update your default password.</p>
      <input id="new1" type="password" placeholder="New password" oninput="checkStrength()">
      <div class="strength-bar"><div id="strength-fill" style="width:0%;background:var(--danger);"></div></div>
      <input id="new2" type="password" placeholder="Confirm" style="margin-top:12px;">
      <button id="update-btn" class="accent" style="width:100%;margin-top:20px;">Update</button></div>`;
    window.checkStrength = () => {
      const p = document.getElementById('new1').value;
      const fill = document.getElementById('strength-fill');
      let score = 0;
      if (p.length > 5) score++;
      if (p.length > 8) score++;
      if (/[A-Z]/.test(p)) score++;
      if (/[0-9]/.test(p)) score++;
      if (/[^A-Za-z0-9]/.test(p)) score++;
      const percent = (score/5)*100;
      fill.style.width = percent+'%';
      fill.style.background = score < 2 ? 'var(--danger)' : score < 4 ? 'var(--accent)' : 'var(--success)';
    };
    document.getElementById('update-btn').onclick = () => {
      const p1=document.getElementById('new1').value.trim(), p2=document.getElementById('new2').value.trim();
      if(p1.length<4) return showToast('Too short',true);
      if(p1!==p2) return showToast('Mismatch',true);
      const users=getUsers(); const i=users.findIndex(u=>u.username===user.username);
      if(i!==-1){ users[i].password=simpleHash(p1); users[i].passwordChanged=true; saveUsers(users); setSession(users[i]); }
      logActivity('password_change'); showToast('Updated'); renderMainApp();
    };
  };

  // Main app – added "My Reports" tab for non-admin
  const renderMainApp = () => {
    const cur=getCurrentUser(); if(!cur) { renderLogin(); return; }
    resetTimer();
    root.innerHTML = `<div class="card" style="display:flex;justify-content:space-between;flex-wrap:wrap;">
      <div class="logo"><span>🔥 Moto Nzuri</span></div>
      <div class="flex-row"><button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>

      <button id="logout-btn" class="danger">↪️ Logout</button></div></div>
      <div class="nav-tabs" id="nav-tabs">
        <button class="nav-tab active" data-tab="dashboard">📊 Dashboard</button>
        <button class="nav-tab" data-tab="merchants">🏪 Merchants</button>
        ${cur.role==='admin' ? '<button class="nav-tab" data-tab="users">👥 Users</button><button class="nav-tab" data-tab="reports">📈 Reports</button>' : ''}
        <button class="nav-tab" data-tab="myreports">📋 My Reports</button>

      document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
      e.target.classList.add('active');
      const t=e.target.dataset.tab;
      if(t==='dashboard') renderDashboard();
      else if(t==='merchants') renderMerchants();
      else if(t==='users') renderUsers();
      else if(t==='reports') renderReports();
      else if(t==='myreports') renderMyReports();
      else if(t==='logs') renderLogs();
      else if(t==='selfies') renderSelfies();
    });
    renderDashboard();
    document.addEventListener('click', resetTimer);
    document.getElementById('fab-invoice').classList.remove('hidden');
    document.getElementById('fab-invoice').onclick = openInvoiceModal;
  };

  // Dashboard (unchanged)
  const renderDashboard = () => {
    const merchants = getMerchants();
    const total = merchants.length;
    const branded = merchants.filter(m=>m.branding==='Branding done').length;
    const pending = merchants.filter(m=>m.status.toLowerCase().includes('waiting') || m.status.toLowerCase().includes('pending')).length;
    const logs = getLogs();
    const lastLogin = logs.filter(l=>l.action==='login').pop();
    const lastLoginTime = lastLogin ? new Date(lastLogin.timestamp).toLocaleString() : 'Never';
    document.getElementById('tab-content').innerHTML = `
      <h3>📊 Dashboard Summary</h3>
      <div class="flex-row" style="justify-content:space-around;">
        <div class="card" style="flex:1;text-align:center;"><h2>${total}</h2><p>Total Shops</p></div>
        <div class="card" style="flex:1;text-align:center;"><h2>${branded}</h2><p>Branded</p></div>
        <div class="card" style="flex:1;text-align:center;"><h2>${pending}</h2><p>Awaiting Confirmation</p></div>
      </div>
      <p style="margin-top:10px;"><strong>Last Login:</strong> ${lastLoginTime}</p>
      ${getCurrentUser()?.role==='admin' ? `
        <div class="flex-row mt-2">
          <button id="backup-data-btn" class="accent">⬇️ Backup All Data (JSON)</button>
          <button id="restore-data-btn">⬆️ Restore from Backup</button>
          <input type="file" id="restore-file-input" accept=".json" style="display:none;">
        </div>` : ''}
    `;
    if(getCurrentUser()?.role==='admin') {
      document.getElementById('backup-data-btn').onclick = () => {
        const backup = { version: APP_VERSION, users: getUsers(), merchants: getMerchants(), logs: getLogs(), selfies: getSelfies() };
        const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `moto_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
        logActivity('backup_downloaded');
      };
      document.getElementById('restore-data-btn').onclick = () => document.getElementById('restore-file-input').click();
      document.getElementById('restore-file-input').onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.users || !data.merchants) throw new Error('Invalid backup');
            saveUsers(data.users); saveMerchants(data.merchants);
            if (data.logs) saveLogs(data.logs);
            if (data.selfies) localStorage.setItem(KEYS.SELFIES, JSON.stringify(data.selfies));
            logActivity('backup_restored'); showToast('Backup restored! Reloading...');
            setTimeout(() => location.reload(), 1000);
          } catch (err) { showToast('Invalid backup file', true); }
        };
        reader.readAsText(file);
      };
    }
  };

  // Merchants (Add button fixed: uses addEventListener)
  let currentFiltered = [];
  const renderMerchants = () => {
    const all = getMerchants(); currentFiltered = all;
    const tab = document.getElementById('tab-content');
    let html = `
      <div class="flex-row" style="justify-content:space-between;flex-wrap:wrap;">
        <h3>📍 Merchants (${all.length})</h3>
        <div class="flex-row">
          <button id="add-merchant-btn" class="accent">➕ Add</button>
          <button id="import-csv-btn">📥 Import CSV</button>
          <button id="export-csv-btn">📤 Export CSV</button>
          <button id="export-pdf-btn">🖨️ PDF</button>
          <button id="share-wa-btn">💬 WhatsApp</button>
        </div>
      </div>
      <div class="flex-row" style="gap:8px;margin-bottom:10px;">
        <input id="merchant-search" type="text" placeholder="🔍 Search name, MN, phone..." style="flex:2;">
        <select id="branding-filter" style="flex:1;">
          <option value="all">🌐 All</option>
          <option value="Branding done">✅ Branding done</option>
          <option value="Pending">⌛ Pending / No</option>
        </select>
      </div>
      <div class="table-wrapper"><table><thead><tr><th>Name</th><th>MN</th><th>Map</th><th>Status</th><th>Branding</th><th>Phone</th><th>Quick Actions</th><th>Edit/Del</th></tr></thead>
      <tbody id="merchant-tbody"></tbody></table></div>
      <input type="file" id="csv-file-input" accept=".csv" style="display:none;">
    `;
    tab.innerHTML = html;
    const tbody = document.getElementById('merchant-tbody');
    const searchInput = document.getElementById('merchant-search');
    const filterSelect = document.getElementById('branding-filter');
    const updateTable = () => {
      const q = searchInput.value.trim().toLowerCase();
      const brand = filterSelect.value;
      currentFiltered = all.filter(m => {
        const matchSearch = q==='' || (m.name&&m.name.toLowerCase().includes(q)) || (m.mn&&m.mn.toLowerCase().includes(q)) || (m.phone&&m.phone.toLowerCase().includes(q)) || (m.contact&&m.contact.toLowerCase().includes(q));
        const matchBrand = brand==='all' || (brand==='Branding done' && m.branding==='Branding done') || (brand==='Pending' && (m.branding!=='Branding done' || !m.branding));
        return matchSearch && matchBrand;
      });
      tbody.innerHTML = currentFiltered.map(m => `
        <tr>
          <td>${escHtml(m.name)}</td><td>${escHtml(m.mn||'')}</td>
          <td><span class="map-link" data-coords="${escAttr(m.coords)}">${m.coords}</span></td>
          <td>${escHtml(m.status||'')}</td>
          <td><span class="badge ${m.branding==='Branding done'?'badge-success':'badge-warning'}">${m.branding||'Pending'}</span></td>
          <td>${escHtml(m.phone||'')}</td>
          <td class="flex-row" style="gap:4px;">
            ${m.phone ? `<a href="tel:${escAttr(m.phone)}" class="btn btn-sm" title="Call">📞</a>
            <a href="https://wa.me/${escAttr(m.phone.replace(/\D/g,''))}" target="_blank" class="btn btn-sm" title="WhatsApp">💬</a>` : ''}
          </td>
          <td class="flex-row">
            <button class="edit-merchant" data-id="${m.id}">✏️</button>
            <button class="del-merchant danger" data-id="${m.id}">🗑️</button>
          </td>
        </tr>`).join('');
    };
    updateTable();
    searchInput.addEventListener('input', updateTable);
    filterSelect.addEventListener('change', updateTable);

    // Event delegation for table actions
    tab.addEventListener('click', (e) => {
      const el = e.target;
      if(el.classList.contains('map-link')) {
        window.open(`https://maps.google.com/?q=${el.dataset.coords}`, '_blank');
        logActivity('map_click', el.dataset.coords);
      } else if(el.classList.contains('edit-merchant')) {
        const m = getMerchants().find(m=>m.id===el.dataset.id); if(m) openMerchantModal(m);
      } else if(el.classList.contains('del-merchant')) {
        if(confirm('Delete?')) {
          saveMerchants(getMerchants().filter(m=>m.id!==el.dataset.id));
          logActivity('delete_merchant');
          renderMerchants(); // re-render to reflect changes
        }
      }
    });

    // Fix: Use addEventListener for the Add button
    document.getElementById('add-merchant-btn').addEventListener('click', () => openMerchantModal());
    document.getElementById('import-csv-btn').addEventListener('click', () => document.getElementById('csv-file-input').click());
    document.getElementById('csv-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const text = ev.target.result;
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) return showToast('Empty CSV', true);
        const header = lines[0].toLowerCase().split(',').map(h => h.trim());
        const nameIdx = header.indexOf('name'), coordsIdx = header.indexOf('coords');
        if (nameIdx === -1 || coordsIdx === -1) return showToast('CSV must contain "name" and "coords" columns', true);
        let imported = 0;
        const newMerchants = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(','); if (cols.length < 2) continue;
          const name = cols[nameIdx]?.trim(), coords = cols[coordsIdx]?.trim();
          if (!name || !coords) continue;
          newMerchants.push({
            id: Date.now().toString() + i, name, coords,
            mn: cols[header.indexOf('mn')]?.trim() || '',
            phone: cols[header.indexOf('phone')]?.trim() || '',
            status: cols[header.indexOf('status')]?.trim() || '',
            branding: cols[header.indexOf('branding')]?.trim() || 'Pending',
            iot: cols[header.indexOf('iot')]?.trim() || '',
            contact: cols[header.indexOf('contact')]?.trim() || ''
          });
          imported++;
        }
        if (imported > 0) {
          const current = getMerchants();
          saveMerchants([...current, ...newMerchants]);
          logActivity('import_csv', `Imported ${imported} merchants`);
          showToast(`Imported ${imported} merchants!`);
          renderMerchants();
        } else showToast('No valid data found', true);
      };
      reader.readAsText(file);
    });
    document.getElementById('export-csv-btn').addEventListener('click', () => {
      const merchants = currentFiltered.length ? currentFiltered : all;
      let csv = 'name,mn,coords,status,branding,iot,phone,contact\n';
      merchants.forEach(m => { csv += `"${m.name||''}","${m.mn||''}","${m.coords||''}","${m.status||''}","${m.branding||''}","${m.iot||''}","${m.phone||''}","${m.contact||''}"\n`; });
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `merchants_${new Date().toISOString().slice(0,10)}.csv`; a.click();
      logActivity('export_csv');
    });
    document.getElementById('export-pdf-btn').addEventListener('click', () => { logActivity('export_pdf'); window.print(); });
    document.getElementById('share-wa-btn').addEventListener('click', () => {
      const list = currentFiltered.map(m=>`${m.name} | MN:${m.mn||'N/A'} | 📞${m.phone||'N/A'} | ${m.coords}`).join('\n');
      window.open(`https://wa.me/?text=${encodeURIComponent('🔥 Moto Nzuri\n'+list)}`, '_blank');
      logActivity('share_whatsapp');
    });
  };

  const openMerchantModal = (merchant=null) => {
    const modal=document.createElement('div'); modal.className='modal';
    modal.innerHTML = `<div class="modal-content"><h3>${merchant?'Edit':'Add'} Merchant</h3>
      <input id="m-name" placeholder="Shop Name" value="${merchant?escAttr(merchant.name):''}">
      <input id="m-coords" placeholder="Coordinates (lat,lng)" value="${merchant?merchant.coords:''}">
      <div class="flex-row"><input id="m-mn" placeholder="MN number" value="${merchant?merchant.mn||'':''}"><input id="m-phone" placeholder="Phone" value="${merchant?merchant.phone||'':''}"></div>
      <textarea id="m-status" rows="2" placeholder="Status / Notes">${merchant?escAttr(merchant.status):''}</textarea>
      <select id="m-branding"><option value="Branding done" ${merchant&&merchant.branding==='Branding done'?'selected':''}>Branding done</option><option value="Pending" ${merchant&&merchant.branding==='Pending'?'selected':''}>Pending</option></select>
      <div class="flex-row" style="justify-content:flex-end;"><button id="cancel-modal">Cancel</button><button id="save-modal" class="accent">Save</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancel-modal').onclick = () => modal.remove();
    document.getElementById('save-modal').onclick = () => {
      const name=document.getElementById('m-name').value.trim(), coords=document.getElementById('m-coords').value.trim();
      if(!name||!coords) return showToast('Name & coordinates required',true);
      const data = { id: merchant? merchant.id : Date.now().toString(), name, coords,
        mn: document.getElementById('m-mn').value.trim(), phone: document.getElementById('m-phone').value.trim(),
        status: document.getElementById('m-status').value.trim(), branding: document.getElementById('m-branding').value };
      let merchants=getMerchants();
      if(merchant) { const idx=merchants.findIndex(m=>m.id===merchant.id); if(idx!==-1) merchants[idx]=data; }
      else merchants.push(data);
      saveMerchants(merchants); logActivity(merchant?'edit_merchant':'add_merchant', name); modal.remove(); renderMerchants(); showToast('Saved');
    };
  };

  // Users (admin only, unchanged)
  const renderUsers = () => {
    if(getCurrentUser()?.role!=='admin') return;
    const users=getUsers();
    const tab=document.getElementById('tab-content');
    tab.innerHTML = `<div class="flex-row"><h3>👥 Users</h3><button id="add-user-btn" class="accent">➕ Add</button></div>
      <div class="table-wrapper"><table><thead><tr><th>Username</th><th>Role</th><th>2FA</th><th>Pwd Changed</th><th></th></tr></thead><tbody>
      ${users.map(u=>`<tr><td>${escHtml(u.username)}</td><td>${u.role}</td><td>${u.totpSecret?'✅':'❌'}</td><td>${u.passwordChanged?'✅':'⚠️'}</td>
      <td><button class="edit-user" data-username="${u.username}">✏️</button>${u.username!=='moto_admin'?`<button class="del-user danger" data-username="${u.username}">🗑️</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`;
    document.getElementById('add-user-btn').onclick = () => openUserModal();
    document.querySelectorAll('.edit-user').forEach(b => b.onclick = () => { const u=getUsers().find(u=>u.username===b.dataset.username); if(u) openUserModal(u); });
    document.querySelectorAll('.del-user').forEach(b => b.onclick = () => { if(confirm('Delete?')) { saveUsers(getUsers().filter(u=>u.username!==b.dataset.username)); logActivity('delete_user'); renderUsers(); } });
  };
  const openUserModal = (user=null) => {
    const modal=document.createElement('div'); modal.className='modal';
    modal.innerHTML = `<div class="modal-content"><h3>${user?'Edit':'Add'} User</h3>
      <input id="u-name" placeholder="Username" value="${user?escAttr(user.username):''}" ${user?'readonly':''}>
      <select id="u-role"><option value="field" ${user&&user.role==='field'?'selected':''}>Field</option><option value="admin" ${user&&user.role==='admin'?'selected':''}>Admin</option></select>
      <input id="u-pass" type="password" placeholder="New password (leave blank)">
      <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="u-2fa" ${user&&user.totpSecret?'checked':''}> Enable 2FA</label>
      <div class="flex-row" style="justify-content:flex-end;"><button id="cancel-user">Cancel</button><button id="save-user" class="accent">Save</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancel-user').onclick = () => modal.remove();
    document.getElementById('save-user').onclick = async () => {
      const username=document.getElementById('u-name').value.trim(), role=document.getElementById('u-role').value;
      const pass=document.getElementById('u-pass').value.trim(), enable2FA=document.getElementById('u-2fa').checked;
      if(!username) return showToast('Username required',true);
      let users=getUsers();
      if(user) {
        const idx=users.findIndex(u=>u.username===user.username);
        if(idx!==-1) {
          if(pass) users[idx].password = simpleHash(pass);
          users[idx].role = role;
          if(enable2FA && !users[idx].totpSecret) {
            const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; let s=''; for(let i=0;i<16;i++) s+=chars.charAt(Math.floor(Math.random()*chars.length));
            users[idx].totpSecret = s; showToast(`2FA secret: ${s}. Save in authenticator.`, false);
          } else if(!enable2FA) users[idx].totpSecret = '';
        }
      } else {
        if(users.some(u=>u.username===username)) return showToast('Exists',true);
        users.push({ username, password: simpleHash(pass||DEFAULT_PASS), role, passwordChanged:false, totpSecret:'' });
      }
      saveUsers(users); logActivity(user?'edit_user':'add_user'); modal.remove(); renderUsers(); showToast('Saved');
    };
  };

  // Admin Reports (unchanged)
  const renderReports = () => {
    if(getCurrentUser()?.role!=='admin') return;
    const users=getUsers();
    document.getElementById('tab-content').innerHTML = `<h3>📊 Activity Reports</h3>
      <div class="flex-row"><select id="r-user"><option value="all">All</option>${users.map(u=>`<option>${escHtml(u.username)}</option>`).join('')}</select>
      <input id="r-start" type="date"><input id="r-end" type="date">
      <button id="gen-report" class="accent">🔍 Generate</button>
      <button id="csv-weekly" class="accent" style="background:#059669;">📤 Weekly CSV</button></div>
      <div id="report-results" class="mt-2"></div>`;
    document.getElementById('r-start').valueAsDate = new Date(); document.getElementById('r-end').valueAsDate = new Date();
    document.getElementById('gen-report').onclick = () => {
      const user=document.getElementById('r-user').value, start=document.getElementById('r-start').value, end=document.getElementById('r-end').value;
      if(!start||!end) return;
      const logs=getLogs().filter(l=> { const d=new Date(l.timestamp).toISOString().split('T')[0]; return d>=start&&d<=end&&(user==='all'||l.user===user); });

      res.innerHTML = `<table><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${logs.map(l=>`<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td>${escHtml(l.user)}</td><td>${escHtml(l.action)}</td><td>${escHtml(l.details)}</td></tr>`).join('')}</table>`;
    };
    document.getElementById('csv-weekly').onclick = () => {
      const weekAgo=new Date(Date.now()-7*86400000).toISOString().split('T')[0];
      const logs=getLogs().filter(l=>l.timestamp>=weekAgo);
      let csv='Timestamp,User,Action,Details\n';
      logs.forEach(l=>{ csv+=`"${l.timestamp}","${l.user}","${l.action}","${(l.details||'').replace(/"/g,'""')}"\n`; });
      const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`moto_weekly_${weekAgo}.csv`; a.click();
      logActivity('export_weekly_csv'); showToast('CSV exported');
    };
  };

  // NEW: My Reports (for all users, shows own activity)
  const renderMyReports = () => {
    const cur = getCurrentUser();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('tab-content').innerHTML = `
      <h3>📋 My Activity Reports</h3>
      <div class="flex-row" style="gap:8px;">
        <button class="preset-btn" data-days="0">Today</button>
        <button class="preset-btn" data-days="1">Yesterday</button>
        <button class="preset-btn" data-days="7">Last 7 Days</button>
        <button class="preset-btn" data-days="30">Last 30 Days</button>
      </div>
      <div class="flex-row mt-2">
        <input id="my-start" type="date" value="${today}"><input id="my-end" type="date" value="${today}">
        <button id="my-gen-report" class="accent">🔍 Generate</button>
      </div>
      <div id="my-report-results" class="mt-2"></div>
    `;
    const startInput = document.getElementById('my-start');
    const endInput = document.getElementById('my-end');
    const generateBtn = document.getElementById('my-gen-report');
    const resultsDiv = document.getElementById('my-report-results');

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const days = parseInt(btn.dataset.days);
        const endDate = new Date();
        if (days === 0) { // today
          startInput.valueAsDate = new Date();
          endInput.valueAsDate = new Date();
        } else if (days === 1) { // yesterday
          const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
          startInput.valueAsDate = yesterday;
          endInput.valueAsDate = yesterday;
        } else {
          const start = new Date(); start.setDate(start.getDate() - days);
          startInput.valueAsDate = start;
          endInput.valueAsDate = new Date();
        }
      });
    });

    generateBtn.addEventListener('click', () => {
      const start = startInput.value;
      const end = endInput.value;
      if (!start || !end) return;
      const logs = getLogs().filter(l => {
        const d = new Date(l.timestamp).toISOString().split('T')[0];
        return d >= start && d <= end && l.user === cur.username;
      });
      if (!logs.length) {
        resultsDiv.innerHTML = '<p>No activity found.</p>';
        return;
      }
      resultsDiv.innerHTML = `<table><tr><th>Time</th><th>Action</th><th>Details</th></tr>
        ${logs.map(l => `<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td>${escHtml(l.action)}</td><td>${escHtml(l.details)}</td></tr>`).join('')}</table>`;
    });
  };

  // Logs (admin only, unchanged)
  const renderLogs = () => {
    const logs=getLogs().slice().reverse();
    document.getElementById('tab-content').innerHTML = `<h3>📜 Logs</h3><table><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${logs.map(l=>`<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td>${escHtml(l.user)}</td><td>${escHtml(l.action)}</td><td>${escHtml(l.details)}</td></tr>`).join('')}</table>`;
  };

  // Selfies (admin only, unchanged)
  const renderSelfies = () => {
    if(getCurrentUser()?.role!=='admin') return;
    const selfies=getSelfies();
    let html=`<h3>📸 Captured Selfies (failed logins)</h3>`;
    if(!selfies.length) html+='<p>No selfies captured.</p>';
    else selfies.forEach(s=>{ html+=`<div class="card"><p>Time: ${new Date(s.timestamp).toLocaleString()}</p><p>User: ${escHtml(s.username)}</p><p>IP: ${s.ip}</p><p>Device: ${JSON.stringify(s.device)}</p>${s.selfie&&s.selfie.startsWith('data:')?`<img src="${s.selfie}" style="max-width:200px;">`:'<p>No image</p>'}</div>`; });
    document.getElementById('tab-content').innerHTML = html;
  };

  // Invoice (unchanged)
  const openInvoiceModal = () => {
    const merchants=getMerchants();
    const modal=document.createElement('div'); modal.className='modal';
    modal.innerHTML = `<div class="modal-content" style="max-width:800px;"><h3>🧾 New Invoice</h3>
      <select id="inv-merchant"><option value="">Select Merchant</option>${merchants.map(m=>`<option value="${m.id}">${escHtml(m.name)}</option>`).join('')}</select>
      <div class="flex-row"><input id="inv-customer" placeholder="Customer"><input id="inv-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div id="inv-items"><div class="flex-row"><input placeholder="Item" class="inv-desc"><input type="number" placeholder="Qty" class="inv-qty" style="width:80px;"><input type="number" placeholder="Price" class="inv-price" style="width:100px;"></div></div>
      <button id="add-item">➕ Add line</button>
      <div class="flex-row" style="justify-content:flex-end;margin-top:15px;"><button id="cancel-inv">Cancel</button><button id="preview-inv" class="accent">👁️ Preview</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('cancel-inv').onclick = () => modal.remove();
    document.getElementById('add-item').onclick = () => {
      const row=document.createElement('div'); row.className='flex-row';
      row.innerHTML = `<input placeholder="Item" class="inv-desc"><input type="number" placeholder="Qty" class="inv-qty" style="width:80px;"><input type="number" placeholder="Price" class="inv-price" style="width:100px;"><button class="remove-row danger">✕</button>`;
      document.getElementById('inv-items').appendChild(row); row.querySelector('.remove-row').onclick = () => row.remove();
    };
    document.getElementById('preview-inv').onclick = () => {
      const mId=document.getElementById('inv-merchant').value;
      const merchant=getMerchants().find(m=>m.id===mId);
      const cust=document.getElementById('inv-customer').value.trim(), date=document.getElementById('inv-date').value;
      if(!merchant||!cust) return showToast('Select merchant & customer',true);
      const items=[]; let total=0;
      document.querySelectorAll('#inv-items .flex-row').forEach(row => {
        const d=row.querySelector('.inv-desc').value.trim(), q=parseFloat(row.querySelector('.inv-qty').value), p=parseFloat(row.querySelector('.inv-price').value);
        if(d && !isNaN(q) && !isNaN(p)) { items.push({desc:d,qty:q,price:p}); total+=q*p; }
      });
      if(!items.length) return showToast('Add items',true);
      modal.remove(); showInvoicePreview(merchant,cust,date,items,total);
    };
  };
  const showInvoicePreview = (merchant,cust,date,items,total) => {
    const modal=document.createElement('div'); modal.className='modal';
    modal.innerHTML = `<div class="modal-content" style="background:white;color:black;"><div style="padding:20px;" id="printable-invoice">
      <h2 style="color:#ff8c00;">🔥 Moto Nzuri</h2><p>Field Operations</p><hr>
      <p><b>Customer:</b> ${escHtml(cust)}</p><p><b>Location:</b> ${escHtml(merchant.name)}</p><p><b>Date:</b> ${date}</p>
      <table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>${items.map(i=>`<tr><td>${escHtml(i.desc)}</td><td>${i.qty}</td><td>${i.price.toFixed(2)}</td><td>${(i.qty*i.price).toFixed(2)}</td></tr>`).join('')}</table>
      <p style="text-align:right;font-weight:bold;">Total: KES ${total.toFixed(2)}</p></div>
      <div class="flex-row" style="justify-content:flex-end;"><button id="close-inv">Close</button><button id="print-inv" class="accent">🖨️ Print</button></div></div>`;
    document.body.appendChild(modal);
    document.getElementById('close-inv').onclick = () => modal.remove();
    document.getElementById('print-inv').onclick = () => {
      const w=window.open('','','width=800,height=600');
      w.document.write(`<html><head><title>Invoice</title><style>body{font-family:monospace;padding:30px;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #000;padding:8px;}</style></head><body>${document.getElementById('printable-invoice').innerHTML}</body></html>`);
      w.document.close(); w.print();
    };
  };

  // Start
  window.addEventListener('load', ()=> {
    try {
      initData();
      if(getCurrentUser()) { resetTimer(); renderMainApp(); }
      else renderLogin();
    } catch(e) {
      document.getElementById('error-banner').style.display='block';
      document.getElementById('error-banner').textContent = 'Error: '+e.message;
    }
  });
})();
</script>
</body>
</html>
