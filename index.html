<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none';">
  <title>🔥 Moto Nzuri · Field Operations</title>
  <style>
    /* ── RESET & GLOBAL FIRE THEME ── */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0b0a09;
      --surface: #1a1613;
      --surface-light: #241e1a;
      --text: #f5e6d3;
      --text-dim: #b8a38b;
      --accent: #ff8c00;
      --accent-glow: #ff4500;
      --flame: #ffb347;
      --success: #2ecc71;
      --danger: #e74c3c;
      --border: #3a2e24;
      --border-active: #ff8c00;
      --shadow: 0 4px 12px rgba(255,69,0,0.2);
      --radius: 10px;
      --transition: 0.2s ease;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 20% 10%, rgba(255,69,0,0.12) 0%, transparent 50%);
    }
    #app-container { width:100%; max-width:1300px; margin:10px auto; padding:15px; }

    /* ── TYPOGRAPHY ── */
    .logo { display:flex; align-items:center; gap:10px; font-size:1.8rem; font-weight:700; }
    .logo span { background: linear-gradient(135deg, #ff8c00, #ff4500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    h1,h2,h3 { font-weight:600; color:var(--flame); text-shadow:0 0 8px rgba(255,140,0,0.4); }
    button, .btn {
      background: var(--surface-light); border:1px solid var(--border); color:var(--text);
      padding:10px 18px; border-radius:25px; font-weight:600; cursor:pointer;
      transition: all var(--transition); display:inline-flex; align-items:center; gap:6px;
      font-size:0.9rem; letter-spacing:0.3px;
    }
    button:hover, .btn:hover { border-color:var(--accent); box-shadow:0 0 15px rgba(255,140,0,0.5); background:#2a211c; }
    button.accent { background: linear-gradient(145deg, #ff8c00, #e67600); border:none; color:#0c0b0a; font-weight:700; box-shadow:0 4px 15px rgba(255,69,0,0.6); }
    button.accent:hover { background: linear-gradient(145deg, #ff9f2e, #ff5e00); }
    button.danger { border-color:var(--danger); color:var(--danger); background:rgba(231,76,60,0.1); }
    button.danger:hover { background:var(--danger); color:#fff; }
    input, select, textarea {
      background:var(--surface); border:1px solid var(--border); padding:12px 15px;
      border-radius:25px; color:var(--text); font-size:0.95rem; width:100%; outline:none;
      transition:var(--transition);
    }
    input:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 0 10px rgba(255,140,0,0.4); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.5); }
    .table-wrapper { overflow-x:auto; border-radius:15px; border:1px solid var(--border); }
    table { width:100%; border-collapse:collapse; background:var(--surface-light); }
    th { background:#2a1f18; padding:12px 10px; text-align:left; font-weight:700; color:var(--flame); border-bottom:2px solid var(--accent); }
    td { padding:10px; border-bottom:1px solid var(--border); }
    tr:hover td { background:rgba(255,140,0,0.05); }
    .badge { display:inline-block; padding:4px 12px; border-radius:15px; font-size:0.75rem; font-weight:700; }
    .badge-success { background:rgba(46,204,113,0.2); color:#2ecc71; border:1px solid #2ecc71; }
    .badge-warning { background:rgba(255,140,0,0.2); color:#ff8c00; border:1px solid #ff8c00; }
    .badge-danger { background:rgba(231,76,60,0.2); color:#e74c3c; border:1px solid #e74c3c; }
    .flex-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .mt-2 { margin-top:15px; } .mb-2 { margin-bottom:15px; }
    .hidden { display:none !important; }
    .modal {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:1000;
    }
    .modal-content {
      background:var(--surface); border:1px solid var(--accent); border-radius:25px;
      padding:25px; max-width:600px; width:90%; max-height:85vh; overflow-y:auto;
      box-shadow:0 10px 30px rgba(255,69,0,0.5);
    }
    .toast {
      position:fixed; bottom:20px; right:20px; background:#2c1e14;
      border-left:4px solid var(--accent); color:var(--text); padding:12px 20px;
      border-radius:30px; box-shadow:0 5px 15px black; z-index:2000;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform:translateX(100px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    /* tabs */
    .nav-tabs { display:flex; gap:5px; border-bottom:1px solid var(--border); margin-bottom:20px; }
    .nav-tab {
      padding:10px 20px; border-radius:15px 15px 0 0; background:transparent; border:none;
      color:var(--text-dim); font-weight:600; cursor:pointer;
    }
    .nav-tab.active { background:var(--surface-light); color:var(--accent); border-bottom:2px solid var(--accent); text-shadow:0 0 5px var(--accent); }
    @media print { body { background:white; color:black; } .no-print, .nav-tabs, button, .modal, .toast, #logout-btn { display:none!important; } .card { box-shadow:none; border:1px solid #ccc; } }
    .map-link { color:var(--accent); text-decoration:underline; cursor:pointer; }
    .history-entry { background:var(--surface-light); border-radius:10px; padding:10px; margin-bottom:8px; border-left:3px solid var(--accent); }
  </style>
</head>
<body>
<div id="app-container">
  <div id="dynamic-root"></div>

<script>
  (function() {
    // ═══════════════════════════════════════
    //  CONSTANTS & STORAGE KEYS
    // ═══════════════════════════════════════
    const STORAGE_KEYS = {
      USERS: 'moto_users',
      MERCHANTS: 'moto_merchants',
      LOGS: 'moto_logs',
      SESSION: 'moto_session'
    };

    // ═══════════════════════════════════════
    //  SECURITY: PASSWORD HASHING (SHA-256)
    // ═══════════════════════════════════════
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ═══════════════════════════════════════
    //  SESSION MANAGEMENT
    // ═══════════════════════════════════════
    let sessionTimer;
    function resetSessionTimer() {
      clearTimeout(sessionTimer);
      sessionTimer = setTimeout(logoutDueToInactivity, SESSION_TIMEOUT);
    }
    function logoutDueToInactivity() {
      const currentUser = getCurrentUser();
      if (currentUser) {
        logActivity('session_timeout', 'Auto logout due to inactivity');
        clearSession();
        renderLogin();
        showToast('Session expired. Please login again.', true);
      }
    }
    function setSession(user) {
      sessionStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(user));
      resetSessionTimer();
    }
    function getCurrentUser() {
      const raw = sessionStorage.getItem(STORAGE_KEYS.SESSION);
      return raw ? JSON.parse(raw) : null;
    }
    function clearSession() {
      sessionStorage.removeItem(STORAGE_KEYS.SESSION);
      clearTimeout(sessionTimer);
    }

    // ═══════════════════════════════════════
    //  DATA LAYER (localStorage)
    // ═══════════════════════════════════════
    function getUsers() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || []; }
    function saveUsers(users) { localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users)); }
    function getMerchants() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.MERCHANTS)) || []; }
    function saveMerchants(merchants) { localStorage.setItem(STORAGE_KEYS.MERCHANTS, JSON.stringify(merchants)); }
    function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_KEYS.LOGS)) || []; }
    function saveLogs(logs) { localStorage.setItem(STORAGE_KEYS.LOGS, JSON.stringify(logs)); }

    function logActivity(action, details = '') {
      const user = getCurrentUser();
      if (!user) return;
      const logs = getLogs();
      logs.push({
        timestamp: new Date().toISOString(),
        user: user.username,
        role: user.role,
        action,
        details: details.substring(0, 200) // limit length
      });
      // keep only last 500 logs
      if (logs.length > 500) logs.shift();
      saveLogs(logs);
    }

    // ═══════════════════════════════════════
    //  INITIALIZATION
    // ═══════════════════════════════════════
    async function initializeData() {
      if (!localStorage.getItem(STORAGE_KEYS.USERS)) {
        const adminHash = await hashPassword('crud');
        const defaultUserHash = await hashPassword(DEFAULT_PASSWORD);
        saveUsers([
          { username:'moto_admin', password: adminHash, role:'admin', passwordChanged:true },
          { username:'fieldagent1', password: defaultUserHash, role:'field', passwordChanged:false }
        ]);
      }
      if (!localStorage.getItem(STORAGE_KEYS.MERCHANTS)) {
        saveMerchants(getDefaultMerchants());
      }
      if (!localStorage.getItem(STORAGE_KEYS.LOGS)) {
        saveLogs([]);
      }
    }

    // ═══════════════════════════════════════
    //  UI HELPERS
    // ═══════════════════════════════════════
    const root = document.getElementById('dynamic-root');
    function showToast(msg, isError=false) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.borderLeftColor = isError ? 'var(--danger)' : 'var(--accent)';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
    function escapeAttr(str) {
      return (str||'').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ═══════════════════════════════════════
    //  RENDER LOGIN
    // ═══════════════════════════════════════
    function renderLogin() {
      root.innerHTML = `
        <div class="card" style="max-width:400px;margin:60px auto;text-align:center;">
          <div class="logo" style="justify-content:center;font-size:2.2rem;"><span>🔥 Moto Nzuri</span></div>
          <p style="color:var(--text-dim);margin:10px 0;">Field Operations · Smart Reports</p>
          <input type="text" id="login-username" placeholder="Phone / Username" autocomplete="off">
          <input type="password" id="login-password" placeholder="Password" style="margin-top:12px;">
          <button id="login-btn" class="accent" style="width:100%;margin-top:20px;">🔐 Sign In</button>
          <p style="font-size:0.75rem;color:var(--text-dim);margin-top:15px;">Default password: motosana00</p>
        </div>
      `;
      document.getElementById('login-btn').addEventListener('click', handleLogin);
    }

    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!username || !password) return showToast('Enter phone/username and password', true);
      const users = getUsers();
      const user = users.find(u => u.username === username);
      if (!user) return showToast('User not found', true);
      const hashedInput = await hashPassword(password);
      if (user.password !== hashedInput) return showToast('Wrong password', true);
      setSession(user);
      logActivity('login', `User ${username} logged in`);
      if (!user.passwordChanged) {
        renderChangePassword(user);
      } else {
        renderMainApp();
      }
    }

    // ═══════════════════════════════════════
    //  CHANGE PASSWORD
    // ═══════════════════════════════════════
    function renderChangePassword(user) {
      root.innerHTML = `
        <div class="card" style="max-width:400px;margin:60px auto;">
          <h3>🔥 Change Password</h3>
          <p style="color:var(--text-dim);">You must update your default password.</p>
          <input type="password" id="new-password1" placeholder="New password">
          <input type="password" id="new-password2" placeholder="Confirm new password" style="margin-top:12px;">
          <button id="update-password-btn" class="accent" style="width:100%;margin-top:20px;">Update Password</button>
        </div>
      `;
      document.getElementById('update-password-btn').addEventListener('click', async () => {
        const p1 = document.getElementById('new-password1').value.trim();
        const p2 = document.getElementById('new-password2').value.trim();
        if (p1.length < 4) return showToast('Password too short (min 4)', true);
        if (p1 !== p2) return showToast('Passwords do not match', true);
        const users = getUsers();
        const idx = users.findIndex(u => u.username === user.username);
        if (idx !== -1) {
          users[idx].password = await hashPassword(p1);
          users[idx].passwordChanged = true;
          saveUsers(users);
          setSession(users[idx]);
          logActivity('password_change', 'User changed password');
          showToast('Password updated!');
          renderMainApp();
        }
      });
    }

    // ═══════════════════════════════════════
    //  MAIN APP (after login)
    // ═══════════════════════════════════════
    function renderMainApp() {
      const currentUser = getCurrentUser();
      if (!currentUser) { renderLogin(); return; }
      resetSessionTimer();
      root.innerHTML = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
          <div class="logo"><span>🔥 Moto Nzuri</span></div>
          <div class="flex-row">
            <span style="color:var(--accent);">👤 ${escapeHtml(currentUser.username)} (${currentUser.role})</span>
            <button id="logout-btn" class="danger">↪️ Logout</button>
          </div>
        </div>
        <div class="nav-tabs" id="nav-tabs">
          <button class="nav-tab active" data-tab="merchants">🏪 Merchants</button>
          ${currentUser.role === 'admin' ? '<button class="nav-tab" data-tab="users">👥 Users</button><button class="nav-tab" data-tab="logs">📜 Activity Logs</button>' : ''}
        </div>
        <div id="tab-content" class="card"></div>
      `;
      document.getElementById('logout-btn').addEventListener('click', () => {
        logActivity('logout');
        clearSession();
        renderLogin();
      });
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          const tabName = e.target.dataset.tab;
          if (tabName === 'merchants') renderMerchantsTab();
          else if (tabName === 'users') renderUsersTab();
          else if (tabName === 'logs') renderLogsTab();
        });
      });
      renderMerchantsTab(); // default
      // activity tracking on user interaction
      document.addEventListener('click', resetSessionTimer);
      document.addEventListener('keypress', resetSessionTimer);
    }

    // ═══════════════════════════════════════
    //  MERCHANTS TAB
    // ═══════════════════════════════════════
    function renderMerchantsTab() {
      const merchants = getMerchants();
      const tabContent = document.getElementById('tab-content');
      let html = `
        <div class="flex-row" style="justify-content:space-between;margin-bottom:15px;">
          <h3>📍 Merchant Locations (${merchants.length})</h3>
          <div class="flex-row">
            <button id="add-merchant-btn" class="accent">➕ Add Merchant</button>
            <button id="export-pdf-btn">🖨️ Export PDF</button>
            <button id="share-wa-btn">💬 Share WhatsApp</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Name</th><th>MN</th><th>Coordinates</th><th>Status</th><th>Branding</th><th>IOT</th><th>Contact</th><th>Actions</th></tr></thead>
            <tbody>
      `;
      merchants.forEach(m => {
        html += `<tr>
          <td>${escapeHtml(m.name)}</td>
          <td>${escapeHtml(m.mn||'')}</td>
          <td><a href="https://www.google.com/maps?q=${m.coords}" target="_blank" class="map-link" onclick="logActivity('map_click','${escapeAttr(m.name)}')">${m.coords}</a></td>
          <td style="max-width:200px;">${escapeHtml(m.status||'')}</td>
          <td><span class="badge ${m.branding.includes('done')?'badge-success':'badge-warning'}">${m.branding||'Pending'}</span></td>
          <td>${escapeHtml(m.iot||'')}</td>
          <td>${escapeHtml(m.contact||'')} ${escapeHtml(m.phone||'')}</td>
          <td class="flex-row" style="gap:4px;">
            <button class="edit-merchant-btn" data-id="${m.id}">✏️</button>
            <button class="history-btn" data-id="${m.id}">📋</button>
            <button class="delete-merchant-btn danger" data-id="${m.id}">🗑️</button>
          </td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      tabContent.innerHTML = html;
      
      document.getElementById('add-merchant-btn').addEventListener('click', () => openMerchantModal());
      document.getElementById('export-pdf-btn').addEventListener('click', () => { logActivity('export_pdf'); window.print(); });
      document.getElementById('share-wa-btn').addEventListener('click', shareWhatsApp);
      
      document.querySelectorAll('.edit-merchant-btn').forEach(b => b.addEventListener('click', (e) => {
        const id = e.target.dataset.id;
        const merchant = getMerchants().find(m => m.id === id);
        if (merchant) openMerchantModal(merchant);
      }));
      document.querySelectorAll('.history-btn').forEach(b => b.addEventListener('click', (e) => {
        const id = e.target.dataset.id;
        renderMerchantHistory(id);
      }));
      document.querySelectorAll('.delete-merchant-btn').forEach(b => b.addEventListener('click', (e) => {
        const id = e.target.dataset.id;
        if (confirm('Delete this merchant?')) {
          let merchants = getMerchants().filter(m => m.id !== id);
          saveMerchants(merchants);
          logActivity('delete_merchant', `Deleted merchant ID ${id}`);
          renderMerchantsTab();
          showToast('Merchant deleted');
        }
      }));
    }

    function openMerchantModal(merchant = null) {
      const isEdit = !!merchant;
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <h3>${isEdit ? 'Edit' : 'Add'} Merchant</h3>
          <input type="text" id="merchant-name" placeholder="Shop Name" value="${isEdit ? escapeAttr(merchant.name) : ''}">
          <div class="flex-row"><input type="text" id="merchant-location" placeholder="Location" value="${isEdit ? escapeAttr(merchant.location) : ''}"><input type="text" id="merchant-coords" placeholder="Lat,Lng" value="${isEdit ? merchant.coords : ''}"></div>
          <input type="text" id="merchant-mn" placeholder="MN number" value="${isEdit ? merchant.mn||'' : ''}">
          <input type="text" id="merchant-iot" placeholder="IOT number" value="${isEdit ? merchant.iot||'' : ''}">
          <textarea id="merchant-status" rows="3" placeholder="Status / Notes">${isEdit ? escapeAttr(merchant.status) : ''}</textarea>
          <select id="merchant-branding">
            <option value="Branding done" ${isEdit && merchant.branding==='Branding done'?'selected':''}>Branding done</option>
            <option value="Pending" ${isEdit && merchant.branding==='Pending'?'selected':''}>Pending</option>
            <option value="No" ${isEdit && merchant.branding==='No'?'selected':''}>No</option>
          </select>
          <div class="flex-row"><input type="text" id="merchant-contact" placeholder="Contact person" value="${isEdit ? merchant.contact||'' : ''}"><input type="text" id="merchant-phone" placeholder="Phone" value="${isEdit ? merchant.phone||'' : ''}"></div>
          <div class="flex-row" style="justify-content:flex-end;margin-top:20px;">
            <button id="cancel-merchant-modal">Cancel</button>
            <button id="save-merchant-btn" class="accent">Save</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('cancel-merchant-modal').addEventListener('click', () => modal.remove());
      document.getElementById('save-merchant-btn').addEventListener('click', () => {
        const name = document.getElementById('merchant-name').value.trim();
        const coords = document.getElementById('merchant-coords').value.trim();
        if (!name || !coords) return showToast('Name and coordinates required', true);
        let merchants = getMerchants();
        const data = {
          id: isEdit ? merchant.id : Date.now().toString(),
          name,
          location: document.getElementById('merchant-location').value.trim(),
          coords,
          mn: document.getElementById('merchant-mn').value.trim(),
          iot: document.getElementById('merchant-iot').value.trim(),
          status: document.getElementById('merchant-status').value.trim(),
          branding: document.getElementById('merchant-branding').value,
          contact: document.getElementById('merchant-contact').value.trim(),
          phone: document.getElementById('merchant-phone').value.trim(),
          notes: '' // reserved
        };
        if (isEdit) {
          const idx = merchants.findIndex(m => m.id === merchant.id);
          if (idx !== -1) merchants[idx] = data;
        } else {
          merchants.push(data);
        }
        saveMerchants(merchants);
        logActivity(isEdit?'edit_merchant':'add_merchant', `Merchant: ${name}`);
        modal.remove();
        renderMerchantsTab();
        showToast('Merchant saved!');
      });
    }

    function renderMerchantHistory(merchantId) {
      const merchant = getMerchants().find(m => m.id === merchantId);
      if (!merchant) return;
      const logs = getLogs().filter(l => l.details.includes(merchant.name) || l.action.includes('merchant'));
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <h3>📜 History for ${escapeHtml(merchant.name)}</h3>
          <div style="max-height:400px;overflow-y:auto;">
            ${logs.length === 0 ? '<p>No activity recorded.</p>' : logs.map(l => `
              <div class="history-entry">
                <strong>${new Date(l.timestamp).toLocaleString()}</strong> - ${escapeHtml(l.user)}<br>
                <span>${escapeHtml(l.action)}: ${escapeHtml(l.details)}</span>
              </div>
            `).join('')}
          </div>
          <button id="close-history-modal" style="margin-top:15px;">Close</button>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('close-history-modal').addEventListener('click', () => modal.remove());
    }

    function shareWhatsApp() {
      const merchants = getMerchants();
      let text = '🔥 *Moto Nzuri Field Report* 🔥\n\n';
      merchants.forEach((m,i) => {
        text += `${i+1}. ${m.name} | MN:${m.mn||'N/A'} | 📍 ${m.coords}\n   Status: ${m.status||'N/A'} | Branding: ${m.branding||'Pending'}\n\n`;
      });
      const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
      logActivity('share_whatsapp', 'Shared merchant list via WhatsApp');
      window.open(url, '_blank');
    }

    // ═══════════════════════════════════════
    //  USERS TAB (ADMIN ONLY)
    // ═══════════════════════════════════════
    function renderUsersTab() {
      const currentUser = getCurrentUser();
      if (!currentUser || currentUser.role !== 'admin') return;
      const users = getUsers();
      const tabContent = document.getElementById('tab-content');
      let html = `
        <div class="flex-row" style="justify-content:space-between;">
          <h3>👥 User Management</h3>
          <button id="add-user-btn" class="accent">➕ Add User</button>
        </div>
        <div class="table-wrapper mt-2">
          <table>
            <thead><tr><th>Username</th><th>Role</th><th>Pwd Changed</th><th>Actions</th></tr></thead>
            <tbody>
      `;
      users.forEach(u => {
        html += `<tr>
          <td>${escapeHtml(u.username)}</td><td>${u.role}</td><td>${u.passwordChanged ? '✅' : '⚠️'}</td>
          <td class="flex-row">
            <button class="edit-user-btn" data-username="${u.username}">✏️</button>
            ${u.username !== 'moto_admin' ? `<button class="delete-user-btn danger" data-username="${u.username}">🗑️</button>` : ''}
          </td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      tabContent.innerHTML = html;
      document.getElementById('add-user-btn').addEventListener('click', () => openUserModal());
      document.querySelectorAll('.edit-user-btn').forEach(b => b.addEventListener('click', (e) => {
        const user = getUsers().find(u => u.username === e.target.dataset.username);
        if (user) openUserModal(user);
      }));
      document.querySelectorAll('.delete-user-btn').forEach(b => b.addEventListener('click', (e) => {
        const username = e.target.dataset.username;
        if (confirm(`Delete user ${username}?`)) {
          let users = getUsers().filter(u => u.username !== username);
          saveUsers(users);
          logActivity('delete_user', `Admin deleted user ${username}`);
          renderUsersTab();
        }
      }));
    }

    function openUserModal(user = null) {
      const isEdit = !!user;
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <h3>${isEdit ? 'Edit' : 'Add'} User</h3>
          <input type="text" id="user-username" placeholder="Phone/Username" value="${isEdit ? escapeAttr(user.username) : ''}" ${isEdit?'readonly':''}>
          <select id="user-role"><option value="field" ${isEdit&&user.role==='field'?'selected':''}>Field Agent</option><option value="admin" ${isEdit&&user.role==='admin'?'selected':''}>Admin</option></select>
          <input type="password" id="user-password" placeholder="New password (leave blank to keep)">
          <div class="flex-row" style="justify-content:flex-end;margin-top:20px;">
            <button id="cancel-user-modal">Cancel</button>
            <button id="save-user-btn" class="accent">Save</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById('cancel-user-modal').addEventListener('click', () => modal.remove());
      document.getElementById('save-user-btn').addEventListener('click', async () => {
        const username = document.getElementById('user-username').value.trim();
        const role = document.getElementById('user-role').value;
        const password = document.getElementById('user-password').value.trim();
        if (!username) return showToast('Username required', true);
        let users = getUsers();
        if (isEdit) {
          const idx = users.findIndex(u => u.username === user.username);
          if (idx !== -1) {
            if (password) users[idx].password = await hashPassword(password);
            users[idx].role = role;
          }
        } else {
          if (users.some(u => u.username === username)) return showToast('Username already exists', true);
          const defaultHash = await hashPassword(password || DEFAULT_PASSWORD);
          users.push({ username, password: defaultHash, role, passwordChanged: false });
        }
        saveUsers(users);
        logActivity(isEdit?'edit_user':'add_user', `User: ${username}`);
        modal.remove();
        renderUsersTab();
        showToast('User saved');
      });
    }

    // ═══════════════════════════════════════
    //  LOGS TAB (ADMIN)
    // ═══════════════════════════════════════
    function renderLogsTab() {
      const logs = getLogs().slice().reverse();
      const tabContent = document.getElementById('tab-content');
      let html = `<h3>📜 Activity Logs (last 500)</h3><div class="table-wrapper mt-2"><table>
        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>`;
      logs.forEach(l => {
        html += `<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td>${escapeHtml(l.user)}</td><td>${escapeHtml(l.action)}</td><td>${escapeHtml(l.details)}</td></tr>`;
      });
      html += `</tbody></table></div>`;
      tabContent.innerHTML = html;
    }

    // ═══════════════════════════════════════
    //  STARTUP
    // ═══════════════════════════════════════
    (async () => {
      await initializeData();
      const currentUser = getCurrentUser();
      if (currentUser) {
        resetSessionTimer();
        renderMainApp();
      } else {
        renderLogin();
      }
    })();
  })();
</script>
</body>
</html>
