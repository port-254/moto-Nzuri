<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none';">
  <title>🔥 Moto Nzuri · Field Operations</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0b0a09; --surface: #1a1613; --surface-light: #241e1a;
      --text: #f5e6d3; --text-dim: #b8a38b; --accent: #ff8c00;
      --accent-glow: #ff4500; --flame: #ffb347; --success: #2ecc71;
      --danger: #e74c3c; --border: #3a2e24; --border-active: #ff8c00;
      --shadow: 0 4px 12px rgba(255,69,0,0.2); --radius: 10px; --transition: 0.2s ease;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-image: radial-gradient(circle at 20% 10%, rgba(255,69,0,0.12) 0%, transparent 50%);
    }
    #app-container { width:100%; max-width:1300px; margin:10px auto; padding:15px; }
    .logo { display:flex; align-items:center; gap:10px; font-size:1.8rem; font-weight:700; }
    .logo span { background: linear-gradient(135deg, #ff8c00, #ff4500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    h1,h2,h3 { font-weight:600; color:var(--flame); text-shadow:0 0 8px rgba(255,140,0,0.4); }
    button, .btn {
      background: var(--surface-light); border:1px solid var(--border); color:var(--text);
      padding:10px 18px; border-radius:25px; font-weight:600; cursor:pointer;
      transition: all var(--transition); display:inline-flex; align-items:center; gap:6px;
      font-size:0.9rem; letter-spacing:0.3px;
    }
    button:hover, .btn:hover { border-color:var(--accent); box-shadow:0 0 15px rgba(255,140,0,0.5); background:#2a211c; color:#fff; }
    button.accent { background: linear-gradient(145deg, #ff8c00, #e67600); border:none; color:#0c0b0a; font-weight:700; box-shadow:0 4px 15px rgba(255,69,0,0.6); }
    button.accent:hover { background: linear-gradient(145deg, #ff9f2e, #ff5e00); }
    button.danger { border-color:var(--danger); color:var(--danger); background:rgba(231,76,60,0.1); }
    button.danger:hover { background:var(--danger); color:#fff; }
    input, select, textarea {
      background:var(--surface); border:1px solid var(--border); padding:12px 15px;
      border-radius:25px; color:var(--text); font-size:0.95rem; width:100%; outline:none; transition:var(--transition);
    }
    input:focus, textarea:focus, select:focus { border-color:var(--accent); box-shadow:0 0 10px rgba(255,140,0,0.4); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:20px; box-shadow:0 8px 20px rgba(0,0,0,0.5); }
    .table-wrapper { overflow-x:auto; border-radius:15px; border:1px solid var(--border); }
    table { width:100%; border-collapse:collapse; background:var(--surface-light); }
    th { background:#2a1f18; padding:12px 10px; text-align:left; font-weight:700; color:var(--flame); border-bottom:2px solid var(--accent); }
    td { padding:10px; border-bottom:1px solid var(--border); }
    tr:hover td { background:rgba(255,140,0,0.05); }
    .badge { display:inline-block; padding:4px 12px; border-radius:15px; font-size:0.75rem; font-weight:700; }
    .badge-success { background:rgba(46,204,113,0.2); color:#2ecc71; border:1px solid #2ecc71; }
    .badge-warning { background:rgba(255,140,0,0.2); color:#ff8c00; border:1px solid #ff8c00; }
    .map-link { color:var(--accent); text-decoration:underline; cursor:pointer; }
    .flex-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .mt-2 { margin-top:15px; } .mb-2 { margin-bottom:15px; }
    .hidden { display:none !important; }
    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal-content { background:var(--surface); border:1px solid var(--accent); border-radius:25px; padding:25px; max-width:600px; width:90%; max-height:85vh; overflow-y:auto; box-shadow:0 10px 30px rgba(255,69,0,0.5); }
    .toast { position:fixed; bottom:20px; right:20px; background:#2c1e14; border-left:4px solid var(--accent); color:var(--text); padding:12px 20px; border-radius:30px; box-shadow:0 5px 15px black; z-index:2000; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from{transform:translateX(100px);opacity:0;} to{transform:translateX(0);opacity:1;} }
    .nav-tabs { display:flex; gap:5px; border-bottom:1px solid var(--border); margin-bottom:20px; }
    .nav-tab { padding:10px 20px; border-radius:15px 15px 0 0; background:transparent; border:none; color:var(--text-dim); font-weight:600; cursor:pointer; }
    .nav-tab.active { background:var(--surface-light); color:var(--accent); border-bottom:2px solid var(--accent); text-shadow:0 0 5px var(--accent); }
    @media print { body{background:white;color:black;} .no-print,.nav-tabs,button,.modal,.toast,#logout-btn{display:none!important;} .card{box-shadow:none;border:1px solid #ccc;} }
  </style>
</head>
<body>
<div id="app-container"><div id="dynamic-root"></div></div>

    const TIMEOUT = 30 * 60 * 1000;
    let sessionTimer;

    // ── SECURITY: SHA-256 HASHING ──
    async function hashPassword(pwd) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(pwd));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // ── SESSION ──
    function resetTimer() { clearTimeout(sessionTimer); sessionTimer = setTimeout(autoLogout, TIMEOUT); }
    function autoLogout() {
      const u = getCurrentUser();
      if (u) { logActivity('session_timeout','Auto logout'); clearSession(); renderLogin(); showToast('Session expired',true); }
    }
    function setSession(user) { sessionStorage.setItem(KEYS.SESSION, JSON.stringify(user)); resetTimer(); }
    function getCurrentUser() { try { return JSON.parse(sessionStorage.getItem(KEYS.SESSION)); } catch(e) { return null; } }
    function clearSession() { sessionStorage.removeItem(KEYS.SESSION); clearTimeout(sessionTimer); }

    function logActivity(action, details='') {

      const logs = getLogs();
      logs.push({ timestamp: new Date().toISOString(), user: u.username, role: u.role, action, details: details.substring(0,200) });
      saveLogs(logs);

    ];

    // ── HELPERS ──
    const root = document.getElementById('dynamic-root');
    function showToast(msg, err=false) {
      const old = document.querySelector('.toast'); if(old) old.remove();
      const t = document.createElement('div'); t.className = 'toast';
      t.style.borderLeftColor = err ? 'var(--danger)' : 'var(--accent)'; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
    }
    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
    function escapeAttr(str) { return (str||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    // ── INIT ──
    async function initData() {
      if(!localStorage.getItem(KEYS.USERS)) {
        const adminHash = await hashPassword('crud');
        const fieldHash = await hashPassword(DEFAULT_PASS);
        saveUsers([
          { username:'moto_admin', password:adminHash, role:'admin', passwordChanged:true },
          { username:'fieldagent1', password:fieldHash, role:'field', passwordChanged:false }
        ]);
      }
      if(!localStorage.getItem(KEYS.MERCHANTS)) saveMerchants(defaultMerchants);
      if(!localStorage.getItem(KEYS.LOGS)) saveLogs([]);
    }

    // ── RENDER LOGIN ──
    function renderLogin() {
      root.innerHTML = `<div class="card" style="max-width:400px;margin:60px auto;text-align:center;">
        <div class="logo" style="justify-content:center;font-size:2.2rem;"><span>🔥 Moto Nzuri</span></div>
        <p style="color:var(--text-dim);">Field Operations · Smart Reports</p>
        <input type="text" id="login-username" placeholder="Phone / Username" autocomplete="off">
        <input type="password" id="login-password" placeholder="Password" style="margin-top:12px;">
        <button id="login-btn" class="accent" style="width:100%;margin-top:20px;">🔐 Sign In</button>
        <p style="font-size:0.75rem;color:var(--text-dim);margin-top:15px;">Default password: motosana00</p>
      </div>`;
      document.getElementById('login-btn').onclick = handleLogin;
    }

    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const pwd = document.getElementById('login-password').value.trim();
      if(!username || !pwd) return showToast('Enter username and password', true);
      const users = getUsers();
      const user = users.find(u => u.username === username);
      if(!user) return showToast('User not found', true);
      const hash = await hashPassword(pwd);
      if(user.password !== hash) return showToast('Wrong password', true);
      setSession(user);
      logActivity('login', `User ${username} logged in`);
      if(!user.passwordChanged) renderChangePassword(user);
      else renderMainApp();
    }

    function renderChangePassword(user) {
      root.innerHTML = `<div class="card" style="max-width:400px;margin:60px auto;">
        <h3>🔥 Change Password</h3><p style="color:var(--text-dim);">You must update your default password.</p>
        <input type="password" id="new1" placeholder="New password"><input type="password" id="new2" placeholder="Confirm" style="margin-top:12px;">
        <button id="update-btn" class="accent" style="width:100%;margin-top:20px;">Update</button></div>`;
      document.getElementById('update-btn').onclick = async () => {
        const p1 = document.getElementById('new1').value.trim();
        const p2 = document.getElementById('new2').value.trim();
        if(p1.length<4) return showToast('Too short', true);
        if(p1!==p2) return showToast('Passwords mismatch', true);
        const users = getUsers(); const idx = users.findIndex(u => u.username===user.username);
        if(idx!==-1) { users[idx].password = await hashPassword(p1); users[idx].passwordChanged = true; saveUsers(users); setSession(users[idx]); }
        logActivity('password_change'); showToast('Password updated'); renderMainApp();
      };
    }

    // ── MAIN APP ──
    function renderMainApp() {
      const cur = getCurrentUser(); if(!cur) { renderLogin(); return; }
      resetTimer();
      root.innerHTML = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
        <div class="logo"><span>🔥 Moto Nzuri</span></div>
        <div class="flex-row"><span style="color:var(--accent);">👤 ${escapeHtml(cur.username)} (${cur.role})</span>
        <button id="logout-btn" class="danger">↪️ Logout</button></div></div>
        <div class="nav-tabs" id="nav-tabs"><button class="nav-tab active" data-tab="merchants">🏪 Merchants</button>
        ${cur.role==='admin'?'<button class="nav-tab" data-tab="users">👥 Users</button><button class="nav-tab" data-tab="logs">📜 Logs</button>':''}</div>
        <div id="tab-content" class="card"></div>`;
      document.getElementById('logout-btn').onclick = () => { logActivity('logout'); clearSession(); renderLogin(); };
      document.querySelectorAll('.nav-tab').forEach(tab => tab.onclick = (e) => {
        document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
        e.target.classList.add('active');
        const tabName = e.target.dataset.tab;
        if(tabName==='merchants') renderMerchants();
        else if(tabName==='users') renderUsers();
        else if(tabName==='logs') renderLogs();
      });
      renderMerchants();
      document.addEventListener('click', resetTimer);
    }

    // ── MERCHANTS TAB (with delegation) ──
    function renderMerchants() {
      const merchants = getMerchants();
      const content = document.getElementById('tab-content');
      let html = `<div class="flex-row" style="justify-content:space-between;"><h3>📍 Merchants (${merchants.length})</h3>
        <div class="flex-row"><button id="add-merchant-btn" class="accent">➕ Add</button>
        <button id="export-pdf-btn">🖨️ PDF</button><button id="share-wa-btn">💬 WhatsApp</button></div></div>
        <div class="table-wrapper"><table><thead><tr><th>Name</th><th>MN</th><th>Map</th><th>Status</th><th>Branding</th><th>IOT</th><th>Contact</th><th>Actions</th></tr></thead><tbody>`;
      merchants.forEach(m => {
        html += `<tr>
          <td>${escapeHtml(m.name)}</td><td>${escapeHtml(m.mn||'')}</td>
          <td><span class="map-link" data-coords="${escapeAttr(m.coords)}" data-name="${escapeAttr(m.name)}">${m.coords}</span></td>
          <td>${escapeHtml(m.status||'')}</td>
          <td><span class="badge ${m.branding.includes('done')?'badge-success':'badge-warning'}">${m.branding||'Pending'}</span></td>
          <td>${escapeHtml(m.iot||'')}</td><td>${escapeHtml(m.contact||'')} ${escapeHtml(m.phone||'')}</td>
          <td class="flex-row"><button class="edit-merchant" data-id="${m.id}">✏️</button>
          <button class="history-merchant" data-id="${m.id}">📋</button>
          <button class="delete-merchant danger" data-id="${m.id}">🗑️</button></td></tr>`;
      });
      html += `</tbody></table></div>`;
      content.innerHTML = html;

      // Event delegation
      content.addEventListener('click', (e) => {
        const target = e.target;
        if(target.classList.contains('map-link')) {
          const coords = target.dataset.coords;
          const name = target.dataset.name;
          logActivity('map_click', `Opened map for ${name}`);
          window.open(`https://www.google.com/maps?q=${coords}`, '_blank');
        }
        else if(target.classList.contains('edit-merchant')) {
          const merchant = getMerchants().find(m => m.id === target.dataset.id);
          if(merchant) openMerchantModal(merchant);
        }
        else if(target.classList.contains('history-merchant')) {
          renderMerchantHistory(target.dataset.id);
        }
        else if(target.classList.contains('delete-merchant')) {
          if(confirm('Delete this merchant?')) {
            const updated = getMerchants().filter(m => m.id !== target.dataset.id);
            saveMerchants(updated); logActivity('delete_merchant', target.dataset.id); renderMerchants(); showToast('Deleted');
          }
        }
      });

      document.getElementById('add-merchant-btn').onclick = () => openMerchantModal();
      document.getElementById('export-pdf-btn').onclick = () => { logActivity('export_pdf'); window.print(); };
      document.getElementById('share-wa-btn').onclick = shareWhatsApp;
    }

    function openMerchantModal(merchant=null) {
      const modal = document.createElement('div'); modal.className = 'modal';
      modal.innerHTML = `<div class="modal-content"><h3>${merchant?'Edit':'Add'} Merchant</h3>
        <input id="m-name" placeholder="Shop Name" value="${merchant?escapeAttr(merchant.name):''}">
        <div class="flex-row"><input id="m-loc" placeholder="Location" value="${merchant?escapeAttr(merchant.location):''}">
        <input id="m-coords" placeholder="lat,lng" value="${merchant?merchant.coords:''}"></div>
        <input id="m-mn" placeholder="MN" value="${merchant?merchant.mn||'':''}">
        <input id="m-iot" placeholder="IOT" value="${merchant?merchant.iot||'':''}">
        <textarea id="m-status" rows="3" placeholder="Status">${merchant?escapeAttr(merchant.status):''}</textarea>
        <select id="m-branding"><option value="Branding done" ${merchant&&merchant.branding==='Branding done'?'selected':''}>Branding done</option>
        <option value="Pending" ${merchant&&merchant.branding==='Pending'?'selected':''}>Pending</option></select>
        <div class="flex-row"><input id="m-contact" placeholder="Contact" value="${merchant?escapeAttr(merchant.contact||''):''}">
        <input id="m-phone" placeholder="Phone" value="${merchant?escapeAttr(merchant.phone||''):''}"></div>
        <div class="flex-row" style="justify-content:flex-end;"><button id="cancel-modal">Cancel</button>
        <button id="save-modal" class="accent">Save</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('cancel-modal').onclick = () => modal.remove();
      document.getElementById('save-modal').onclick = () => {
        const name = document.getElementById('m-name').value.trim();
        const coords = document.getElementById('m-coords').value.trim();
        if(!name||!coords) return showToast('Name & coords required',true);
        const data = {
          id: merchant ? merchant.id : Date.now().toString(),
          name, location: document.getElementById('m-loc').value.trim(), coords,
          mn: document.getElementById('m-mn').value.trim(), iot: document.getElementById('m-iot').value.trim(),
          status: document.getElementById('m-status').value.trim(), branding: document.getElementById('m-branding').value,
          contact: document.getElementById('m-contact').value.trim(), phone: document.getElementById('m-phone').value.trim(), kp:''
        };
        let merchants = getMerchants();
        if(merchant) { const idx = merchants.findIndex(m=>m.id===merchant.id); if(idx!==-1) merchants[idx]=data; }
        else merchants.push(data);
        saveMerchants(merchants); logActivity(merchant?'edit_merchant':'add_merchant', name);
        modal.remove(); renderMerchants(); showToast('Saved');
      };
    }

    function renderMerchantHistory(id) {
      const merchant = getMerchants().find(m=>m.id===id); if(!merchant) return;
      const logs = getLogs().filter(l=>l.details.includes(merchant.name));
      const modal = document.createElement('div'); modal.className='modal';
      modal.innerHTML = `<div class="modal-content"><h3>History: ${escapeHtml(merchant.name)}</h3>
        <div style="max-height:300px;overflow:auto;">${logs.map(l=>`<div class="history-entry"><strong>${new Date(l.timestamp).toLocaleString()}</strong> - ${escapeHtml(l.user)}<br>${escapeHtml(l.action)}: ${escapeHtml(l.details)}</div>`).join('')||'No activity'}</div>
        <button id="close-hist" style="margin-top:15px;">Close</button></div>`;
      document.body.appendChild(modal);
      document.getElementById('close-hist').onclick = () => modal.remove();
    }

    function shareWhatsApp() {
      const list = getMerchants().map((m,i)=>`${i+1}. ${m.name} | MN:${m.mn||'N/A'} | ${m.coords}\n   ${m.status||''} | ${m.branding||'Pending'}`).join('\n\n');
      window.open(`https://wa.me/?text=${encodeURIComponent('🔥 Moto Nzuri Report\n\n'+list)}`, '_blank');
      logActivity('share_whatsapp');
    }

    // ── USERS ──
    function renderUsers() {
      if(getCurrentUser()?.role!=='admin') return;
      const users = getUsers();
      document.getElementById('tab-content').innerHTML = `<div class="flex-row"><h3>👥 Users</h3><button id="add-user-btn" class="accent">➕ Add</button></div>
        <div class="table-wrapper"><table><thead><tr><th>Username</th><th>Role</th><th>Pwd Changed</th><th></th></tr></thead><tbody>
        ${users.map(u=>`<tr><td>${escapeHtml(u.username)}</td><td>${u.role}</td><td>${u.passwordChanged?'✅':'⚠️'}</td>
        <td class="flex-row"><button class="edit-user" data-username="${u.username}">✏️</button>
        ${u.username!=='moto_admin'?`<button class="delete-user danger" data-username="${u.username}">🗑️</button>`:''}</td></tr>`).join('')}
        </tbody></table></div>`;
      document.getElementById('add-user-btn').onclick = () => openUserModal();
      document.querySelectorAll('.edit-user').forEach(b => b.onclick = () => {
        const user = getUsers().find(u=>u.username===b.dataset.username); if(user) openUserModal(user);
      });
      document.querySelectorAll('.delete-user').forEach(b => b.onclick = () => {
        if(confirm('Delete user?')) { const updated = getUsers().filter(u=>u.username!==b.dataset.username); saveUsers(updated); logActivity('delete_user',b.dataset.username); renderUsers(); }
      });
    }

    function openUserModal(user=null) {
      const modal = document.createElement('div'); modal.className='modal';
      modal.innerHTML = `<div class="modal-content"><h3>${user?'Edit':'Add'} User</h3>
        <input id="u-name" placeholder="Username" value="${user?escapeAttr(user.username):''}" ${user?'readonly':''}>
        <select id="u-role"><option value="field" ${user&&user.role==='field'?'selected':''}>Field</option><option value="admin" ${user&&user.role==='admin'?'selected':''}>Admin</option></select>
        <input type="password" id="u-pass" placeholder="New password (leave blank)">
        <div class="flex-row" style="justify-content:flex-end;"><button id="cancel-user">Cancel</button><button id="save-user" class="accent">Save</button></div></div>`;
      document.body.appendChild(modal);
      document.getElementById('cancel-user').onclick = () => modal.remove();
      document.getElementById('save-user').onclick = async () => {
        const username = document.getElementById('u-name').value.trim();
        const role = document.getElementById('u-role').value;
        const pass = document.getElementById('u-pass').value.trim();
        if(!username) return showToast('Username required',true);
        let users = getUsers();
        if(user) {
          const idx = users.findIndex(u=>u.username===user.username);
          if(idx!==-1) { if(pass) users[idx].password = await hashPassword(pass); users[idx].role = role; }
        } else {
          if(users.some(u=>u.username===username)) return showToast('User exists',true);
          users.push({ username, password: await hashPassword(pass||DEFAULT_PASS), role, passwordChanged:false });
        }
        saveUsers(users); logActivity(user?'edit_user':'add_user', username); modal.remove(); renderUsers(); showToast('Saved');
      };
    }

    function renderLogs() {
      const logs = getLogs().slice().reverse();
      document.getElementById('tab-content').innerHTML = `<h3>📜 Activity Logs</h3><div class="table-wrapper"><table>
        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>
        ${logs.map(l=>`<tr><td>${new Date(l.timestamp).toLocaleString()}</td><td>${escapeHtml(l.user)}</td><td>${escapeHtml(l.action)}</td><td>${escapeHtml(l.details)}</td></tr>`).join('')}
        </tbody></table></div>`;
    }

    // ── START ──
    (async ()=>{
      await initData();
      if(getCurrentUser()) { resetTimer(); renderMainApp(); } else renderLogin();
    })();
  })();
</script>
</body>
</html>
